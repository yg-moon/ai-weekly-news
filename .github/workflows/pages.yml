name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**'
      - 'data/**'
      - 'scripts/**'
      - 'static/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 직렬화한다. 진행 중인 배포를 취소하지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 이번 푸시로 바뀐 발행물의 외부 링크를 연다. 깨진 링크가 있으면 배포하지 않는다.
      # 이미 나간 호의 링크가 나중에 죽어도 새 호를 막지 않도록 바뀐 파일만 본다.
      # 수동 실행 때, 그리고 강제 푸시처럼 이전 커밋을 비교할 수 없을 때는 가장 최근 주간호를 본다.
      - name: Check links
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- content | grep '\.md$' || true)
          else
            echo "바뀐 파일을 알 수 없어 가장 최근 주간호를 본다"
            files=$(ls content/week/*.md | sort | tail -1)
          fi
          if [ -z "$files" ]; then echo "바뀐 발행물이 없다"; exit 0; fi
          node scripts/check-links.mjs $files
      - run: npm run build
      # Pages는 저장소 설정에서 미리 켜 두어야 한다. configure-pages 의
      # enablement 파라미터는 GITHUB_TOKEN 권한 부족으로 동작하지 않는다.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
